name: 출시 빌드 (구글 플레이용 AAB)

# 수동 실행: GitHub > Actions > 출시 빌드 > Run workflow
# 필요한 비밀값(Settings > Secrets and variables > Actions):
#   UPLOAD_KEYSTORE_BASE64, UPLOAD_KEYSTORE_PASSWORD
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: '버전 이름 (예: 1.0.0)'
        required: true
        default: '1.0.0'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK 라이선스 동의
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4

      - name: 서명키 준비 (비밀값에서 꺼내기)
        env:
          KS: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS" ]; then echo "::error::UPLOAD_KEYSTORE_BASE64 비밀값이 없습니다. 출시 안내서의 '서명키 등록'을 먼저 해 주세요."; exit 1; fi
          echo "$KS" | base64 -d > "$RUNNER_TEMP/upload.jks"

      - name: 검사 + 출시 AAB·APK 빌드
        env:
          UPLOAD_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          chmod +x gradlew
          ./gradlew testReleaseUnitTest bundleRelease assembleRelease --stacktrace

      - name: 결과를 Releases에 올리기
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="v${{ inputs.version_name }}-${{ github.run_number }}"
          cp app/build/outputs/bundle/release/app-release.aab "AIJoso-${V}.aab"
          cp app/build/outputs/apk/release/app-release.apk "AIJoso-${V}-설치확인용.apk"
          gh release create "$V" "AIJoso-${V}.aab" "AIJoso-${V}-설치확인용.apk" \
            --title "AI Joso ${V} (구글 플레이 업로드용)" \
            --notes "AAB: Play Console에 올리는 파일 · APK: 출시 빌드가 휴대폰에서 잘 열리는지 확인용 (버전 코드 ${{ github.run_number }})" \
            --prerelease
