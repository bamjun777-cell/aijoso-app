name: 테스트 APK 빌드

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: 검사(콘텐츠·검색·비속어 필터) + APK 빌드
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug --stacktrace

      - name: 빌드 결과 보관
        uses: actions/upload-artifact@v4
        with:
          name: AIJoso-test-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: 휴대폰에서 받을 수 있게 '최신 테스트 APK'로 올리기
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk AIJoso-test.apk
          gh release delete test-latest -y --cleanup-tag || true
          gh release create test-latest AIJoso-test.apk \
            --title "AI 좋소 테스트 APK" \
            --notes "자동 빌드 $(date -u +%Y-%m-%d) · ${GITHUB_SHA::7}" \
            --prerelease
