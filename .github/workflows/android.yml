name: 테스트 APK 빌드

on:
  push:
    branches: [ main ]
    # 앱 관련 파일이 바뀔 때만 APK를 다시 빌드 (웹만 바뀌면 건너뜀)
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub 빌드 서버에 이미 설치된 Android SDK 사용 (라이선스만 동의)
      - name: Android SDK 라이선스 동의
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4

      - name: 검사(콘텐츠·검색·비속어 필터) + APK 빌드
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug assembleRelease --stacktrace

      - name: 빌드 결과 보관
        uses: actions/upload-artifact@v4
        with:
          name: AIWorkRecipe-test-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: 휴대폰에서 받을 수 있게 '최신 테스트 APK'로 올리기
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk AIWorkRecipe-test.apk
          gh release delete test-latest -y --cleanup-tag || true
          gh release create test-latest AIWorkRecipe-test.apk \
            --title "AI 업무 레시피 테스트 APK" \
            --notes "자동 빌드 $(date -u +%Y-%m-%d) · ${GITHUB_SHA::7}" \
            --prerelease
