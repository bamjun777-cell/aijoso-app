name: 웹사이트 배포

# 콘텐츠(content.json)나 웹 파일이 바뀌면 웹사이트를 다시 만들어 GitHub Pages(무료)에 올린다
on:
  push:
    branches: [ main ]
    paths:
      - 'web/**'
      - 'app/src/main/assets/**'
      - 'content/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: pages
        uses: actions/configure-pages@v5
      - name: 웹사이트 만들기
        run: python3 web/build.py --site-url "${{ steps.pages.outputs.base_url }}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
